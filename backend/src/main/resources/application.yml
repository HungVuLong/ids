spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:1306/ids_db}
    username: ${DB_USERNAME:ids_user}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:5000}

server:
  port: 8080
